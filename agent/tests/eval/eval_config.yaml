# Milestone 15 — .agents-cli-spec.md § Non-Functional Requirements: "Eval
# dataset encodes the 10 test scenarios from Success Criteria as agents-cli
# eval LLM-judge cases, not pytest. Pytest covers scoring.py's deterministic
# formulas and Firestore tool schema validation only."
#
# root_agent is orchestrator_agent — `eval generate` can only exercise the
# ORCHESTRATOR's public surface (a natural-language message in, a full
# college_intake_pipeline run, a plain-language reply out), not an
# individual sub-agent directly. So instead of 10 separate cases (which
# would mean 10 full live-research pipeline runs — slow and real API
# spend), this dataset uses 3 real orchestrator prompts, each graded by
# `collegentic_behavior_quality.py` — a single local LLM-judge covering all
# 5 spec-derived behavioral dimensions the 10 scenarios collapse into (see
# that file's own docstring for the full scenario -> dimension mapping and
# which mechanics are already pytest-covered instead).
#
# Two of the three cases (the real-research ones) are NOT produced by
# `agents-cli eval generate` — see tests/eval/capture_traces.py's docstring:
# that command's local HTTP path has a hardcoded 120s inter-event read
# timeout with no CLI override, and Collegentic's real research pipeline
# routinely goes quiet longer than that during a single google_search-heavy
# LLM call. capture_traces.py runs the exact same root_agent in-process via
# InMemoryRunner (bypassing only the HTTP layer, not any pipeline logic)
# and writes tests/eval/datasets/collegentic-live-traces.json in the same
# grading-input trace shape `eval generate` would have produced. The third
# case (ambiguous college name) is cheap enough to go through the normal
# `eval generate` path directly.
#
# Also local rather than the managed Vertex Eval service
# (`prompt_template`/`judge_model` fields): that path wants `judge_model`
# as a full Vertex resource name rather than a bare model string, and
# rejects any trace event with no `content` — our before_agent_callback's
# legitimate state-delta-only events, present in every case here. Neither
# was worth fighting for this suite; local grading sidesteps both and
# still uses a real LLM judge (see "No eval region fits your data-
# residency rules?" in the eval skill for this exact fallback pattern).
metrics_to_run:
  - collegentic_behavior_quality
  - no_submission_claims
  - agent_turn_count

custom_metrics:
  - name: collegentic_behavior_quality
    custom_function_file: collegentic_behavior_quality.py

  # Deterministic, non-LLM safety net for the hitl_safety dimension above —
  # cheap and non-flaky. No agent has a real submission/send tool at all,
  # so this checks the ORCHESTRATOR'S TEXT never falsely claims to have
  # done one of these things.
  - name: no_submission_claims
    custom_function_file: no_submission_claims.py

  # Cheap sanity signal: how many turns the Orchestrator took. Not a
  # pass/fail gate on its own, just a quick outlier check (an unexpectedly
  # huge turn count usually means a retry loop or confused tool-calling).
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
